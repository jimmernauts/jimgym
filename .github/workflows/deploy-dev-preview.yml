name: Deploy jimgym dev preview

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: jimgym-dev-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev-preview
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          gleam-version: '1.17.0'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Update the existing dev preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set this variable in the dev-preview environment}"
          : "${CLOUDFLARE_API_TOKEN:?Set this secret in the dev-preview environment}"
          bindings=$(bunx wrangler preview secret list --name dev)
          grep -q TURSO_URL <<< "$bindings"
          grep -q TURSO_AUTH_TOKEN <<< "$bindings"
          bunx wrangler preview --name dev --ignore-base-config --tag "$GITHUB_SHA"
